    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette while React and Dexie settings load.
      (function () {
        try {
          var cached = localStorage.getItem('you-theme');
          var theme = cached === 'light' || cached === 'dark' ? cached : null;
          if (!theme) {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
